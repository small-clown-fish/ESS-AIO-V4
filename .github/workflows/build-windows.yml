name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Verify entrypoint
        shell: pwsh
        run: |
          if (-not (Test-Path "app.py")) {
            Write-Error "app.py not found. Please update the PyInstaller entrypoint in .github/workflows/build-windows.yml."
            exit 1
          }

      - name: Prepare default config templates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "default_configs" | Out-Null

          # These are packaged only as fallback templates. Runtime configs should live in the user data directory.
          foreach ($cfg in @("pcs_config.json", "runtime_config.json", "site_config.json")) {
            if ((Test-Path $cfg) -and (-not (Test-Path "default_configs/$cfg"))) {
              Copy-Item $cfg "default_configs/$cfg" -Force
            }
          }

      - name: Build EXE
        shell: pwsh
        run: |
          $addData = @()

          # Package static resources and fallback templates only.
          # Do not package profiles/default as a runtime profile, because user runtime configs should be loaded from APPDATA.
          $items = @(
            @{src="bms_logger/protocols"; dst="bms_logger/protocols"},
            @{src="bms_profiles"; dst="bms_profiles"},
            @{src="pcs_profiles"; dst="pcs_profiles"},
            @{src="protocols"; dst="protocols"},
            @{src="config_templates"; dst="config_templates"},
            @{src="default_configs"; dst="default_configs"},
            @{src="docs"; dst="docs"},
            @{src="templates"; dst="templates"},
            @{src="alarm_map.json"; dst="."}
          )

          foreach ($item in $items) {
            if (Test-Path $item.src) {
              $addData += "--add-data"
              $addData += "$($item.src);$($item.dst)"
            } else {
              Write-Host "Skip missing resource: $($item.src)"
            }
          }

          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name ESS-AIO `
            --collect-all PySide6 `
            app.py `
            @addData

      - name: Create ZIP artifact
        shell: pwsh
        run: |
          if (Test-Path "ESS-AIO-windows.zip") {
            Remove-Item "ESS-AIO-windows.zip" -Force
          }
          Compress-Archive -Path "dist/ESS-AIO/*" -DestinationPath "ESS-AIO-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESS-AIO-windows
          path: ESS-AIO-windows.zip
